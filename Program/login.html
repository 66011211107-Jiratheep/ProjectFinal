<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - โต๊ะจีนออนไลน์</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- นำเข้า Font Awesome สำหรับไอคอนลูกตา -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* จัดโครงสร้าง input-group ให้รองรับไอคอนลูกตา */
        .password-group {
            position: relative;
            width: 100%;
        }
        
        /* ปรับแต่งระยะห่างไม่ให้ข้อความพิมพ์ทับไอคอน */
        .password-group input {
            width: 100%;
            padding-right: 40px !important;
            box-sizing: border-box;
        }

        /* จัดตำแหน่งไอคอนลูกตาไว้ด้านขวามือ */
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #777;
            z-index: 10;
        }
        
        .toggle-password:hover {
            color: #a00000;
        }
    </style>
    <link rel="stylesheet" href="theme.css?v=20260820">
</head>
<body class="page-auth">

    <header class="main-header">
        <div class="container">
            <nav class="main-nav">
                <ul>
                    <li><a href="index.php">หน้าหลัก</a></li>
                    <li><a href="register.html">สมัครสมาชิก</a></li>
                    <li><a href="login.html" class="active">เข้าสู่ระบบ</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="register-container">
        <div class="register-box">
            <div class="auth-brand">โต๊ะจีนออนไลน์</div>
            <h2>เข้าสู่ระบบ</h2>
            <p class="auth-subtitle">เข้าสู่ระบบเพื่อดูประวัติการจองและจัดการงานของคุณ</p>
            <form action="login_process.php" method="POST">
                <div class="input-group">
                    <input type="text" name="email" placeholder="อีเมล หรือ ชื่อผู้ใช้" required>
                </div>
                
                <!-- ช่อง Password + ไอคอนลูกตา -->
                <div class="input-group password-group">
                    <input type="password" id="login_password" name="password" placeholder="Password" required>
                    <i class="fa-solid fa-eye toggle-password" onclick="togglePassword('login_password', this)"></i>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn-submit">เข้าสู่ระบบ</button>
                    <a href="index.php" class="btn-cancel">ยกเลิก</a>
                </div>
            </form>
        </div>
    </main>

    <!-- JS สำหรับสลับโหมดเปิด/ปิดตา -->
    <script>
        function togglePassword(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }
    </script>

</body>
</html>
